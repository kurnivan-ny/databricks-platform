<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 480" width="1024" height="480" role="img" aria-label="CI/CD flow: a feature branch opens a pull request, CI runs, and merging to develop deploys changed projects to DEV. A pull request from develop to main runs CI again; merging to main starts Deploy PROD, which waits for approval in the prod environment before deploying. Rollback reruns Deploy PROD with a release tag and passes the same approval." font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>CI/CD flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1024" height="480" rx="16" fill="#ffffff"/>
  <text x="24" y="40" font-size="18" font-weight="700" fill="#0f172a">CI/CD flow</text>
  <text x="24" y="60" font-size="12" fill="#64748b">GitHub Actions + Databricks Asset Bundles · only changed projects deploy</text>

  <!-- lanes -->
  <rect x="16" y="72" width="992" height="136" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="16" y="240" width="992" height="136" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">
    <text x="984" y="96" text-anchor="end">develop → DEV · automatic</text>
    <text x="984" y="264" text-anchor="end">main → PROD · manual approval</text>
  </g>

  <!-- lane 1 boxes -->
  <g font-size="12" fill="#475569" text-anchor="middle">
    <rect x="40" y="112" width="176" height="80" rx="10" fill="#ffffff" stroke="#64748b"/>
    <text x="128" y="142" font-size="13" font-weight="700" fill="#0f172a">Feature branch</text>
    <text x="128" y="162">local development</text>
    <text x="128" y="180">pytest · ruff</text>

    <rect x="296" y="112" width="176" height="80" rx="10" fill="#eef4ff" stroke="#3563c9"/>
    <text x="384" y="142" font-size="13" font-weight="700" fill="#0f172a">CI · ci.yml</text>
    <text x="384" y="162">lint · unit tests</text>
    <text x="384" y="180">bundle validate</text>

    <rect x="552" y="112" width="176" height="80" rx="10" fill="#eef4ff" stroke="#3563c9"/>
    <text x="640" y="142" font-size="13" font-weight="700" fill="#0f172a">Deploy DEV</text>
    <text x="640" y="162">changed projects</text>
    <text x="640" y="180">deploy → run → verify</text>

    <rect x="808" y="112" width="176" height="80" rx="10" fill="#e7f6ee" stroke="#2a8c55"/>
    <text x="896" y="142" font-size="13" font-weight="700" fill="#0f172a">DEV</text>
    <text x="896" y="162">catalog dev</text>
    <text x="896" y="180">tag deploy/dev/&lt;p&gt;</text>
  </g>

  <!-- lane 2 boxes -->
  <g font-size="12" fill="#475569" text-anchor="middle">
    <rect x="40" y="280" width="176" height="80" rx="10" fill="#eef4ff" stroke="#3563c9"/>
    <text x="128" y="310" font-size="13" font-weight="700" fill="#0f172a">CI · ci.yml</text>
    <text x="128" y="330">lint · unit tests</text>
    <text x="128" y="348">bundle validate</text>

    <rect x="296" y="280" width="176" height="80" rx="10" fill="#eef4ff" stroke="#3563c9"/>
    <text x="384" y="310" font-size="13" font-weight="700" fill="#0f172a">Deploy PROD</text>
    <text x="384" y="330">changed projects</text>
    <text x="384" y="348">deploy-prod.yml</text>

    <rect x="552" y="280" width="176" height="80" rx="10" fill="#fff4e5" stroke="#c77700"/>
    <text x="640" y="310" font-size="13" font-weight="700" fill="#0f172a">Approval</text>
    <text x="640" y="330">environment prod</text>
    <text x="640" y="348">required reviewer</text>

    <rect x="808" y="280" width="176" height="80" rx="10" fill="#e7f6ee" stroke="#2a8c55"/>
    <text x="896" y="310" font-size="13" font-weight="700" fill="#0f172a">PROD</text>
    <text x="896" y="330">catalog prod</text>
    <text x="896" y="348">tag release/&lt;p&gt;/&lt;ts&gt;</text>
  </g>

  <!-- rollback -->
  <rect x="552" y="400" width="432" height="56" rx="10" fill="#fdf2f2" stroke="#b42318" stroke-dasharray="5 3"/>
  <text x="576" y="424" font-size="13" font-weight="700" fill="#0f172a">Rollback</text>
  <text x="576" y="444" font-size="12" fill="#475569">run Deploy PROD manually · ref = release/&lt;project&gt;/&lt;timestamp&gt;</text>

  <!-- edges -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M216 152 H294" marker-end="url(#arrow)"/>
    <path d="M472 152 H550" marker-end="url(#arrow)"/>
    <path d="M728 152 H806" marker-end="url(#arrow)"/>
    <path d="M896 192 V224 H128 V278" marker-end="url(#arrow)"/>
    <path d="M216 320 H294" marker-end="url(#arrow)"/>
    <path d="M472 320 H550" marker-end="url(#arrow)"/>
    <path d="M728 320 H806" marker-end="url(#arrow)"/>
    <path d="M640 400 V362" marker-end="url(#arrow)"/>
  </g>
  <rect x="448" y="216" width="128" height="16" fill="#ffffff"/>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="256" y="144">open PR</text>
    <text x="512" y="144">merge</text>
    <text x="768" y="144">deploys</text>
    <text x="512" y="228">PR develop → main</text>
    <text x="256" y="312">merge</text>
    <text x="512" y="312">waits for</text>
    <text x="768" y="312">approve</text>
    <text x="648" y="385" text-anchor="start">same approval</text>
  </g>
</svg>
