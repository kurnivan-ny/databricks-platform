<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 336" width="1064" height="336" role="img" aria-label="Sales data flow: the generator writes JSON files to the landing volume; bronze loads only new files; silver merges on business keys and sends rejected rows to quarantine; gold aggregates; metric views define every KPI; the dashboard queries the metric views and the quality checks compare them with a Python reference." font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Sales data flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1064" height="336" rx="16" fill="#ffffff"/>
  <text x="24" y="40" font-size="18" font-weight="700" fill="#0f172a">Sales data flow</text>
  <text x="24" y="60" font-size="12" fill="#64748b">job sales_daily · serverless · same code for catalogs dev and prod</text>

  <!-- wrapper bracket over bronze..gold -->
  <path d="M376 104 V96 H848 V104" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="612" y="88" font-size="12" fill="#475569" text-anchor="middle">tables.yml + SQL files · run by platform_common.tables</text>

  <!-- main row -->
  <g font-size="12" fill="#475569" text-anchor="middle">
    <rect x="24" y="112" width="120" height="88" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="84" y="146" font-size="13" font-weight="700" fill="#0f172a">Generator</text>
    <text x="84" y="168">job task</text>
    <text x="84" y="186">missing days</text>

    <rect x="200" y="112" width="120" height="88" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="260" y="146" font-size="13" font-weight="700" fill="#0f172a">Landing volume</text>
    <text x="260" y="168">sales_landing</text>
    <text x="260" y="186">JSON per day</text>

    <rect x="376" y="112" width="120" height="88" rx="10" fill="#f6e7d8" stroke="#a0693a"/>
    <text x="436" y="146" font-size="13" font-weight="700" fill="#0f172a">Bronze</text>
    <text x="436" y="168">4 raw tables</text>
    <text x="436" y="186">append only</text>

    <rect x="552" y="112" width="120" height="88" rx="10" fill="#eceff4" stroke="#7b8494"/>
    <text x="612" y="146" font-size="13" font-weight="700" fill="#0f172a">Silver</text>
    <text x="612" y="168">4 clean tables</text>
    <text x="612" y="186">expectations</text>

    <rect x="728" y="112" width="120" height="88" rx="10" fill="#fbf0c9" stroke="#b8901a"/>
    <text x="788" y="146" font-size="13" font-weight="700" fill="#0f172a">Gold</text>
    <text x="788" y="168">3 measure tables</text>
    <text x="788" y="186">full rebuild</text>

    <rect x="904" y="112" width="120" height="88" rx="10" fill="#e6eefc" stroke="#3563c9"/>
    <text x="964" y="146" font-size="13" font-weight="700" fill="#0f172a">Metric views</text>
    <text x="964" y="168">2 views</text>
    <text x="964" y="186">all KPI formulas</text>
  </g>

  <!-- main-row edges -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M144 156 H198" marker-end="url(#arrow)"/>
    <path d="M320 156 H374" marker-end="url(#arrow)"/>
    <path d="M496 156 H550" marker-end="url(#arrow)"/>
    <path d="M672 156 H726" marker-end="url(#arrow)"/>
    <path d="M848 156 H902" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="172" y="148">writes</text>
    <text x="348" y="148">new files</text>
    <text x="524" y="148">MERGE</text>
    <text x="700" y="148">aggregate</text>
    <text x="876" y="148">source</text>
  </g>

  <!-- second row -->
  <g font-size="12" fill="#475569" text-anchor="middle">
    <rect x="552" y="248" width="120" height="56" rx="10" fill="#fdf2f2" stroke="#b42318"/>
    <text x="612" y="272" font-size="13" font-weight="700" fill="#0f172a">Quarantine</text>
    <text x="612" y="292">*_quarantine</text>

    <rect x="728" y="248" width="120" height="56" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="788" y="272" font-size="13" font-weight="700" fill="#0f172a">Quality checks</text>
    <text x="788" y="292">vs Python ref</text>

    <rect x="904" y="248" width="120" height="56" rx="10" fill="#e7f6ee" stroke="#2a8c55"/>
    <text x="964" y="272" font-size="13" font-weight="700" fill="#0f172a">AI/BI dashboard</text>
    <text x="964" y="292">29 widgets</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M612 200 V246" marker-end="url(#arrow)"/>
    <path d="M936 200 V224 H788 V246" marker-end="url(#arrow)"/>
    <path d="M992 200 V246" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#475569">
    <text x="620" y="228">rejected rows</text>
    <text x="862" y="218" text-anchor="middle">compared by</text>
    <text x="1000" y="228">queries</text>
  </g>
</svg>
